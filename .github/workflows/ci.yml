name: CI

description: Lints, tests, builds, and packages the .vsix on pull requests and pushes to master.

on:
  pull_request:
  push:
    branches:
      - master

# Cancel in-progress CI runs for the same ref when a new push occurs,
# preventing redundant builds and saving CI resources.
concurrency:
  group: ci-ext-vscode-adblock-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, build
    runs-on: team-extensions
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Stamp a dev version BEFORE the Docker builds so package.json is
      # consistent across test-output and build-output layers. package.json
      # has no committed version — CI injects one derived from CHANGELOG.
      - name: Set dev version
        env:
          NIGHTLY_POSTFIX: -nightly
        run: |
          set +e
          LATEST="$(grep -oE '## \[[0-9]+\.[0-9]+\.[0-9]+[^]]*\]' CHANGELOG.md \
            | head -n1 | sed -E 's/## \[([^]]+)\].*/\1/')"
          if [ -z "${LATEST:-}" ]; then
            LATEST="$(git tag --sort=-v:refname | head -n1 | sed -E 's/^v//')"
          fi
          set -e
          : "${LATEST:=0.0.0}"
          DEV_VERSION="${LATEST}${NIGHTLY_POSTFIX}"
          echo "Dev version: ${DEV_VERSION}"
          npm pkg set version="${DEV_VERSION}"

      - name: Build and test via Docker
        run: DOCKER_BUILDKIT=1 docker build --progress plain --target test-output .

      - name: Build release artifacts
        run: |
          DOCKER_BUILDKIT=1 docker build --progress plain \
            --target build-output \
            --output ./artifacts \
            .

      - name: Upload vsix package
        uses: actions/upload-artifact@v4
        with:
          name: vscode-adblock-vsix
          path: |
            artifacts/vscode-adblock.vsix
            artifacts/adblock.plist
