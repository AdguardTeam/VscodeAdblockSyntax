name: Prepare release

description: >-
  Opens a release PR that finalizes CHANGELOG.md for the given tag.
  After merge, publish-release.yml takes over. Odd minor (e.g. v2.1.x) =
  Marketplace pre-release; even minor (e.g. v2.2.x) = stable.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag WITH "v" prefix. Odd minor = pre-release channel
          (e.g. v2.1.5); even minor = stable (e.g. v2.2.0).
        required: true
        type: string

# `contents: write` — push the release-bump branch
# `id-token: write` — Octopass OIDC for PR creation
permissions:
  contents: write
  id-token: write

jobs:
  create-release-pr:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/create-release-pr.yml@master
    with:
      tag: ${{ inputs.tag }}
      team: extensions
